# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - master
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # jobs/sync_bitcointalk and jobs/sync_mailing_list run on their own
      # scheduled Machines (sync-bitcointalk, sync-mailing-list), kept off
      # the web app's machine entirely so a 25-30 min sync never competes
      # with it for CPU/memory.
      # Those Machines pin a specific image tag at creation time and don't
      # follow deploys on their own, so every deploy has to explicitly push
      # the just-deployed image onto them or they'd silently keep running
      # whatever code was live when they were created.
      - name: Update scheduled job machines to the new image
        run: |
          set -euo pipefail
          MACHINES=$(flyctl machine list --app sabio-bitcoin --json)
          IMAGE=$(echo "$MACHINES" | jq -r '.[] | select(.config.metadata.fly_process_group == "app") | "\(.image_ref.registry)/\(.image_ref.repository):\(.image_ref.tag)"')
          for NAME in sync-bitcointalk sync-mailing-list; do
            ID=$(echo "$MACHINES" | jq -r --arg name "$NAME" '.[] | select(.name == $name) | .id')
            flyctl machine update "$ID" --image "$IMAGE" --app sabio-bitcoin --yes
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
